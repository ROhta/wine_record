# Dependabot による依存更新（ROhta/bingo_next の設定を本リポジトリ構成に合わせて移植）。
#
# 共通方針:
# - グループ化（groups: "*"）で 1 エコシステム = 1 PR にまとめ、ノイズを抑える。
# - 全エコシステム共通で patch のみ ignore し、minor 以上は PR 化する
#   （patch は取りこぼしても影響が小さい一方、minor を据え置くと固定版が古いまま取り残されるため）。
# - cooldown で新リリース直後の更新を一定期間待ち、地雷バージョンを踏みにくくする。
#   minor を PR 化する以降は semver-minor-days が地雷バージョン回避の要になる。
# - rebase-strategy: auto / branch separator "_" / labels: dependencies で運用を bingo_next と揃える。
version: 2
updates:
  # npm（ルートの package.json）。
  # patch は ignore し minor 以上を PR 化する（patch のノイズは抑えつつ、機能追加・非推奨対応には追随する。
  # セキュリティ更新は Dependabot security updates として別途発火するため影響なし）。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Asia/Tokyo"
    allow:
      - dependency-type: "all"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 10
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    groups:
      npm-all-dependencies:
        patterns:
          - "*"

  # Terraform（iac/ のプロバイダ・モジュール）。本リポジトリの iac はフラット構成のため directory: "/iac"。
  - package-ecosystem: "terraform"
    directory: "/iac"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 10
    # 他エコシステムと揃えて patch のみ ignore する（プロバイダの patch 更新まで PR 化するとノイズが勝るため）。
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    groups:
      terraform-all-dependencies:
        patterns:
          - "*"

  # GitHub Actions（.github/workflows/）。CI は SHA 固定（sha_pinning_required）。
  # Dependabot は更新時に SHA とバージョンコメント（# v4.4.0）を併せて書き換えるため pin 形式は保たれる。
  # npm 同様 patch のみ ignore し、minor 以上は PR 化する
  # （アクションのリリースは大半が minor であり、据え置くと固定 SHA が古いまま取り残されるため。
  # セキュリティ更新は別途発火）。
  # composite action（.github/actions/）は未使用のため directory は "/" のみ。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    groups:
      github-all-dependencies:
        patterns:
          - "*"
