# wine_record のツールバージョン単一真実源（SSoT）。
# node / pnpm / terraform / apm を mise で管理する。
# ローカル・CI は本ファイルを消費する。mise が届かない環境は別途同期（README / .apm/instructions/setup 参照）:
#   - Vercel 本番ビルド:
#       node = iac/main.tf の node_version（24.x）。package.json に engines.node を置くと Vercel は
#              そちらをプロジェクト設定より優先し node_version が無効化されるため、置かないこと。
#       pnpm = package.json の packageManager。Corepack 未有効でも Vercel がこれを読む
#              （ビルドログ: Detected `pnpm-lock.yaml` ... with package.json#packageManager）。
#              mise.toml との一致は `mise run check-versions`（CI で実行）が検証する。
#   - Terraform Cloud リモート実行: terraform 版は TFC workspace 設定（iac/versions.tf の required_version を満たす）
# node は Vercel が提供するメジャー（20.x / 22.x / 24.x）に制約されるため、上流に新しいメジャーが出ても 24 系に据え置く。
[tools]
node = "24.18.0"
pnpm = "11.17.0"
terraform = "1.15.8"
# Agent Package Manager（AI エージェント instructions 管理）。registry 未収録のため github backend で取得。
"github:microsoft/apm" = { version = "0.26.0", extract_all = "true" }

[settings]
lockfile = true

# mise が届かない Vercel ビルド向けに package.json 側へ複写している pnpm 版が、
# SSoT（上記 [tools] pnpm）から乖離していないことを検証する。
# terraform の required_version や Vercel の node_version は「制約 ⊇ 固定値」の関係であり
# 等値ではないため、ここでは検証しない（等値化すると恒久的に失敗する）。
[tasks.check-versions]
description = "mise.toml の pnpm 版と package.json の packageManager が一致することを検証する"
run = '''
want="$(mise config get tools.pnpm)"
got="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"pnpm@\([^"]*\)".*/\1/p' package.json)"
if [ -z "$got" ]; then
  echo "package.json: packageManager を読み取れない" >&2
  exit 1
fi
if [ "$got" != "$want" ]; then
  echo "package.json: packageManager=pnpm@$got が mise.toml の pnpm=$want と不一致" >&2
  exit 1
fi
echo "pnpm 版一致: $want"
'''
